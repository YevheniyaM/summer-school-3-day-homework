name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-repo-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          echo "All required files present"